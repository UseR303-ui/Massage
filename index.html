<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje Privado</title>
  <!-- Google Fonts para una tipografía elegante y moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <style>
        /* ==========================================================================
           VARIABLES Y CONFIGURACIÓN GLOBAL
           ========================================================================== */
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #1a162b 0%, #0d0b18 50%, #05040a 100%);
            --card-bg: rgba(23, 20, 38, 0.55);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-glow: rgba(147, 112, 219, 0.3);
            
            --primary-accent: #a78bfa;
            --primary-accent-hover: #c4b5fd;
            --primary-glow: rgba(167, 139, 250, 0.25);
            
            --secondary-bg: rgba(255, 255, 255, 0.04);
            --secondary-border: rgba(255, 255, 255, 0.12);
            --secondary-hover: rgba(255, 255, 255, 0.08);
            
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-accent: #e9d5ff;
            
            --error-color: #f87171;
            --error-glow: rgba(248, 113, 113, 0.2);
            
            --font-heading: 'Cinzel', serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Canvas de Partículas de Fondo */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Contenedor Principal */
        .container {
            width: 100%;
            max-width: 680px;
            z-index: 1;
            position: relative;
        }

        /* Tarjeta con Glassmorphism */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(138, 43, 226, 0.05);
            transition: var(--transition-smooth);
        }

        /* ==========================================================================
           PANTALLA PIN
           ========================================================================== */
        #pin-screen {
            text-align: center;
            max-width: 420px;
            margin: 0 auto;
            opacity: 1;
            transform: scale(1);
            transition: var(--transition-smooth);
        }

        #pin-screen.fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .icon-lock {
            width: 48px;
            height: 48px;
            margin-bottom: 20px;
            color: var(--primary-accent);
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .pin-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .pin-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 28px;
            font-weight: 300;
        }

        .pin-input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .pin-input {
            width: 100%;
            padding: 16px;
            background: rgba(10, 8, 20, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: #fff;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
            transition: var(--transition-smooth);
            font-family: monospace;
        }

        .pin-input:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 20px var(--primary-glow);
            background: rgba(15, 12, 28, 0.8);
        }

        .pin-input::placeholder {
            letter-spacing: 2px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.25);
            font-family: var(--font-body);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 20px;
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .error-message.visible {
            opacity: 1;
        }

        /* Animación de error (Shake) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            border-color: var(--error-color) !important;
            box-shadow: 0 0 15px var(--error-glow) !important;
        }

        /* ==========================================================================
           BOTONES
           ========================================================================== */
        .btn {
            width: 100%;
            padding: 14px 24px;
            border-radius: 14px;
            border: none;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: var(--font-body);
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: #ffffff;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.4);
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text-main);
            border: 1px solid var(--secondary-border);
        }

        .btn-secondary:hover {
            background: var(--secondary-hover);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        /* ==========================================================================
           PANTALLA MENSAJE
           ========================================================================== */
        #message-screen {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--transition-smooth);
        }

        #message-screen.visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .message-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .message-title {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            color: var(--text-accent);
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .message-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Área del Texto del Mensaje */
        .message-body {
            position: relative;
            background: rgba(10, 8, 20, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
            line-height: 1.8;
            font-size: 1.05rem;
            color: rgba(243, 244, 246, 0.9);
            white-space: pre-line; /* Mantiene saltos de línea */
            word-wrap: break-word;
            min-height: 200px;
            max-height: 60vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-accent) transparent;
        }

        .message-body::-webkit-scrollbar {
            width: 6px;
        }
        .message-body::-webkit-scrollbar-thumb {
            background-color: rgba(167, 139, 250, 0.3);
            border-radius: 3px;
        }

        /* Estado Encubierto (Asteriscos) */
        .encrypted-text {
            font-family: monospace;
            letter-spacing: 2px;
            color: rgba(167, 139, 250, 0.5);
            word-break: break-all;
            user-select: none;
        }

        /* Fade para la aparición del texto descifrado */
        .fade-in-text {
            animation: fadeInText 0.6s ease-out forwards;
        }

        @keyframes fadeInText {
            from { opacity: 0; filter: blur(4px); }
            to { opacity: 1; filter: blur(0); }
        }

        /* Grupo de Botones de Acción */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Iconos SVG inline */
        .btn-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Estado del botón de audio activo */
        .btn-speaking {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: rgba(239, 68, 68, 0.4) !important;
            color: #fca5a5 !important;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 600px) {
            .glass-card {
                padding: 28px 20px;
                border-radius: 20px;
            }

            .action-buttons {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .message-title {
                font-size: 1.35rem;
            }

            .message-body {
                padding: 20px;
                font-size: 0.98rem;
                line-height: 1.7;
            }
        }
    </style>
 </head>
 <body>
  <!-- Canvas para efecto sutil de partículas -->
  <canvas id="particles-canvas"></canvas>
  <div class="container">
   <!-- ==========================================================================
             PANTALLA INICIAL: INGRESO DE PIN
             ========================================================================== -->
   <div id="pin-screen" class="glass-card">
    <svg class="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
     <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect> <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <h1 class="pin-title">ACCESO PRIVADO</h1>
    <p class="pin-subtitle">Ingresa el código PIN para continuar</p>
    <div class="pin-input-group">
     <input type="password" id="pin-input" class="pin-input" maxlength="8" placeholder="••••" autocomplete="off" inputmode="numeric">
     <div id="error-message" class="error-message">PIN incorrecto. Inténtalo de nuevo.</div>
    </div>
    <button id="pin-submit-btn" class="btn btn-primary"><span>Entrar</span>
     <svg class="btn-icon" viewBox="0 0 24 24">
      <line x1="5" y1="12" x2="19" y2="12"></line> <polyline points="12 5 19 12 12 19"></polyline>
     </svg></button>
   </div>
   <!-- ==========================================================================
             PANTALLA PRINCIPAL: MENSAJE PRIVADO
             ========================================================================== -->
   <div id="message-screen" class="glass-card">
    <div class="message-header">
     <h2 class="message-title">Para Ti</h2>
     <span class="message-subtitle">Mensaje Confidencial</span>
    </div>
    <!-- Contenedor del Mensaje -->
    <div id="message-content" class="message-body encrypted-text">
     <!-- Se poblará vía JS -->
    </div>
    <!-- Botones de Interacción -->
    <div class="action-buttons">
     <!-- Botón Descifrar / Ocultar -->
     <button id="toggle-decrypt-btn" class="btn btn-primary">
      <svg class="btn-icon" viewBox="0 0 24 24">
       <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect> <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
      </svg>
      <span id="decrypt-btn-text">Descifrar mensaje</span>
     </button>
     <!-- Botón Escuchar / Detener -->
     <button id="toggle-speech-btn" class="btn btn-secondary">
      <svg class="btn-icon" viewBox="0 0 24 24">
       <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon> <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
      <span id="speech-btn-text">Escuchar mensaje</span>
     </button>
    </div>
   </div>
  </div>
  <!-- ==========================================================================
         LÓGICA JAVASCRIPT
         ========================================================================== -->
  <script>
        /* --------------------------------------------------------------------------
           CONFIGURACIÓN EDITABLE
           -------------------------------------------------------------------------- */
        
        // Define el PIN numérico de acceso
        const ACCESS_PIN = "7701";

        // Define el mensaje secreto exacto
        const SECRET_MESSAGE = `He observado algo y quiero decírtelo con calma. No sé si estoy completamente seguro, pero es una sensación que he tenido varias veces durante el tiempo que hemos estado juntos. En algunas ocasiones, cuando hemos tenido discusiones o malentendidos, he sentido que actuabas como si no tuvieras pareja, como si estuvieras soltera. No sé si lo hacías para darme celos o si simplemente era mi percepción, pero es algo que se me quedó muy marcado.

Siempre he dicho que no vale la pena vivir aferrados al pasado, pero para explicarte mejor por qué siento esto necesito recordar algo que pasó hace meses.

Recuerdo que un sábado o un domingo, no estoy seguro del día, habíamos quedado en jugar SuperSus. Esa mañana te prometí que jugaríamos por la tarde, cuando regresara. Sí tenía la intención de hacerlo, pero después recordé que también había quedado con unos amigos para jugar Brawl Stars, y fui con ellos para inventarles una excusa y no jugar.

Tú te enojaste porque pensaste que iba a jugar con ellos. En ese momento comenzaste a jugar con Ozuna. Lo que me dolió no fue solo que jugaras con él, sino que sentí que actuaste como si estuvieras sola, como si nuestra conversación o lo que habíamos acordado ya no importara. Yo te había dicho que me esperaras un momento, pero sentí que eso no tuvo peso para ti y que fuiste muy rápido a jugar con él.

Tal vez estoy interpretando las cosas de una manera equivocada, y ojalá sea así. Pero esa situación me dejó una inseguridad que todavía recuerdo.

Lo que quiero decir, en pocas palabras, es que a veces siento que cuando te aburres de una persona o surge un problema, buscas a alguien más. El ejemplo que se me viene a la mente es Eduardo, a quien terminaste reemplazando por mí. Y, siendo completamente honesto, me da miedo que algún día pase lo mismo conmigo por un simple malentendido.

No te estoy diciendo esto para pelear ni para reprocharte algo. Te lo digo porque prefiero ser sincero contigo y contarte lo que a veces pasa por mi cabeza, aunque no tenga toda la razón. Solo quiero que entiendas por qué, en ciertos momentos, me siento inseguro y por qué ese temor aparece en mí.`;

        /* --------------------------------------------------------------------------
           ESTADO DE LA APLICACIÓN
           -------------------------------------------------------------------------- */
        let isDecrypted = false;
        let isSpeaking = false;
        let synth = window.speechSynthesis;
        let currentUtterance = null;

        /* --------------------------------------------------------------------------
           ELEMENTOS DOM
           -------------------------------------------------------------------------- */
        const pinScreen = document.getElementById('pin-screen');
        const messageScreen = document.getElementById('message-screen');
        const pinInput = document.getElementById('pin-input');
        const pinSubmitBtn = document.getElementById('pin-submit-btn');
        const errorMessage = document.getElementById('error-message');
        
        const messageContent = document.getElementById('message-content');
        const toggleDecryptBtn = document.getElementById('toggle-decrypt-btn');
        const decryptBtnText = document.getElementById('decrypt-btn-text');
        const toggleSpeechBtn = document.getElementById('toggle-speech-btn');
        const speechBtnText = document.getElementById('speech-btn-text');

        /* --------------------------------------------------------------------------
           INICIALIZACIÓN
           -------------------------------------------------------------------------- */
        document.addEventListener('DOMContentLoaded', () => {
            // Genera la representación cifrada inicial
            renderEncryptedText();
            
            // Event Listeners PIN
            pinSubmitBtn.addEventListener('click', validatePin);
            pinInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') validatePin();
            });

            // Limpiar mensaje de error al escribir
            pinInput.addEventListener('input', () => {
                errorMessage.classList.remove('visible');
                pinInput.classList.remove('shake');
            });

            // Event Listeners Mensaje
            toggleDecryptBtn.addEventListener('click', toggleDecrypt);
            toggleSpeechBtn.addEventListener('click', toggleSpeech);

            // Cargar voces para SpeechSynthesis (algunos navegadores requieren este evento)
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => {};
            }
        });

        /* --------------------------------------------------------------------------
           LÓGICA PANTALLA PIN
           -------------------------------------------------------------------------- */
        function validatePin() {
            const val = pinInput.value.trim();
            if (val === ACCESS_PIN) {
                // Éxito: Transición a pantalla de mensaje
                pinScreen.classList.add('fade-out');
                setTimeout(() => {
                    pinScreen.style.display = 'none';
                    messageScreen.style.display = 'block';
                    // Forzar reflow para animación suave
                    void messageScreen.offsetWidth;
                    messageScreen.classList.add('visible');
                }, 400);
            } else {
                // Error: Animación y feedback
                pinInput.classList.add('shake');
                errorMessage.classList.add('visible');
                pinInput.value = '';
                pinInput.focus();
            }
        }

        /* --------------------------------------------------------------------------
           LÓGICA MENSAJE (CIFRADO / DESCIFRADO)
           -------------------------------------------------------------------------- */
        function renderEncryptedText() {
            // Reemplaza caracteres alfanuméricos por '*' manteniendo párrafos
            const masked = SECRET_MESSAGE.replace(/[^\s]/g, '*');
            messageContent.innerText = masked;
            messageContent.classList.add('encrypted-text');
            messageContent.classList.remove('fade-in-text');
        }

        function toggleDecrypt() {
            if (!isDecrypted) {
                // Revelar texto real
                messageContent.innerText = SECRET_MESSAGE;
                messageContent.classList.remove('encrypted-text');
                messageContent.classList.add('fade-in-text');
                decryptBtnText.innerText = "Ocultar mensaje";
                isDecrypted = true;
            } else {
                // Volver a ocultar con asteriscos
                renderEncryptedText();
                decryptBtnText.innerText = "Descifrar mensaje";
                isDecrypted = false;
                
                // Detener lectura si está activa
                if (isSpeaking) {
                    stopSpeech();
                }
            }
        }

        /* --------------------------------------------------------------------------
           LÓGICA WEB SPEECH API (LECTURA EN VOZ ALTA)
           -------------------------------------------------------------------------- */
        function toggleSpeech() {
            if (isSpeaking) {
                stopSpeech();
            } else {
                startSpeech();
            }
        }

        function startSpeech() {
            if (!('speechSynthesis' in window)) {
                alert("Tu navegador no soporta la lectura de voz en alto.");
                return;
            }

            // Cancelar cualquier lectura previa
            synth.cancel();

            // Crear la locución usando EXCLUSIVAMENTE la constante SECRET_MESSAGE
            currentUtterance = new SpeechSynthesisUtterance(SECRET_MESSAGE);
            
            // Selección de voz en español
            const voices = synth.getVoices();
            const esVoice = voices.find(v => v.lang.startsWith('es-MX')) || 
                            voices.find(v => v.lang.startsWith('es-ES')) || 
                            voices.find(v => v.lang.startsWith('es'));
            
            if (esVoice) {
                currentUtterance.voice = esVoice;
            }
            currentUtterance.lang = 'es-ES';
            currentUtterance.rate = 0.9; // Velocidad ligeramente pausada y expresiva
            currentUtterance.pitch = 1.0;

            // Manejo de eventos de reproducción
            currentUtterance.onstart = () => {
                isSpeaking = true;
                speechBtnText.innerText = "Detener lectura";
                toggleSpeechBtn.classList.add('btn-speaking');
            };

            currentUtterance.onend = () => {
                resetSpeechState();
            };

            currentUtterance.onerror = () => {
                resetSpeechState();
            };

            // Iniciar lectura
            synth.speak(currentUtterance);
        }

        function stopSpeech() {
            if (synth) {
                synth.cancel();
            }
            resetSpeechState();
        }

        function resetSpeechState() {
            isSpeaking = false;
            speechBtnText.innerText = "Escuchar mensaje";
            toggleSpeechBtn.classList.remove('btn-speaking');
        }

        /* --------------------------------------------------------------------------
           EFECTO DE PARTÍCULAS SUTILES (FONDO)
           -------------------------------------------------------------------------- */
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 45;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.fade = Math.random() * 0.005 + 0.002;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Parpadeo suave
                this.alpha += this.fade;
                if (this.alpha > 0.6 || this.alpha < 0.1) {
                    this.fade = -this.fade;
                }

                // Reiniciar si sale de la pantalla
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(167, 139, 250, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        animateParticles();
    </script>
 </body>
</html>
